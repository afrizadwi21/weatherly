name: Weatherly CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Workspace Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check modified paths
        id: filter
        run: |
          if [ -d "backend" ] && [ -f "backend/go.mod" ]; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          if [ -d "apps/web" ] && [ -f "apps/web/package.json" ]; then
            echo "web=true" >> $GITHUB_OUTPUT
          else
            echo "web=false" >> $GITHUB_OUTPUT
          fi

  backend-ci:
    name: "Backend CI (Golang + PostGIS + Redis)"
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: weatherly_test
          POSTGRES_PASSWORD: weatherly_test_password
          POSTGRES_DB: weatherly_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.mod

      - name: Download Go Modules & Verify
        run: |
          go mod download
          go mod verify

      - name: Run Go Vet & Format Check
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend

      - name: Run Database Migrations (golang-migrate)
        if: hashFiles('backend/migrations/*.sql') != ''
        env:
          DATABASE_URL: postgres://weatherly_test:weatherly_test_password@localhost:5432/weatherly_test_db?sslmode=disable
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -path ./migrations -database "$DATABASE_URL" up

      - name: Build API & Worker Binaries
        run: |
          go build -v ./cmd/...

      - name: Run Go Tests with Race Detector
        env:
          DATABASE_URL: postgres://weatherly_test:weatherly_test_password@localhost:5432/weatherly_test_db?sslmode=disable
          REDIS_ADDR: localhost:6379
          JWT_SECRET_KEY: ci-test-secret-key-do-not-use-in-prod
          APP_ENV: test
        run: |
          go test -v -race -coverprofile=coverage.out ./...

  web-ci:
    name: "Web CI (Next.js + TypeScript)"
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
        run: npm run build
